<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jupiter FX</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f14;
    color: #e6e6e6;
    font-family: -apple-system, Roboto, sans-serif;
    padding: 20px 12px;
    padding-bottom: 100px; /* room for fixed bottom bar */
  }
  .wrap {
    max-width: 420px;
    margin: 0 auto;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 8px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    border: none;
    cursor: pointer;
    color: #fff;
  }
  .btn-select { background: #e8544f; }
  .btn-upload { background: #2ecc71; color: #0d0f14; }
  .btn-download { background: #e08a2c; }

  .runbar-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0d0f14;
    border-top: 1px solid #23262f;
    padding: 10px 12px 16px;
  }
  .runbar-inner {
    max-width: 420px;
    margin: 0 auto;
  }
  .expand-row {
    text-align: center;
    color: #6b7280;
    font-size: 18px;
    margin-bottom: 6px;
    cursor: pointer;
  }
  .disclaimer-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }
  .disclaimer-btn {
    background: #2ecc71;
    color: #0d0f14;
    font-weight: 700;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
  }
  .run-status-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .run-btn {
    background: #1fc7c3;
    color: #0d0f14;
    font-weight: 800;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 8px;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    cursor: pointer;
  }
  .status-track {
    flex: 1;
    background: #1a1d26;
    border-radius: 8px;
    padding: 14px 10px;
    text-align: center;
    font-size: 13px;
    color: #9aa0aa;
    font-weight: 600;
    position: relative;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #6b7280;
    border-radius: 50%;
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="btn-row">
    <button class="btn btn-select" onclick="alert('Select Bot')">☰ Select Bot</button>
    <button class="btn btn-upload" onclick="alert('Upload Bot')">⬆ Upload Bot</button>
    <button class="btn btn-download" onclick="alert('Download Bot')">⬇ Download Bot</button>
  </div>
</div>

<div class="runbar-wrap">
  <div class="runbar-inner">
    <div class="expand-row">^</div>
    <div class="disclaimer-row">
      <button class="disclaimer-btn">Risk Disclaimer</button>
    </div>
    <div class="run-status-row">
      <button class="run-btn" id="runBtn" onclick="toggleRun()">▶ Run</button>
      <div class="status-track">
        <span id="statusText">Bot is not running</span>
        <span class="status-dot"></span>
      </div>
    </div>
  </div>
</div>

<script>
  let running = false;
  function toggleRun() {
    running = !running;
    const btn = document.getElementById("runBtn");
    const status = document.getElementById("statusText");
    if (running) {
      btn.textContent = "⏸ Stop";
      status.textContent = "Bot is running";
    } else {
      btn.textContent = "▶ Run";
      status.textContent = "Bot is not running";
    }
  }
</script>

</body>
</html>
